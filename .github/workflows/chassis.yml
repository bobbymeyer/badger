name: Chassis

# The chassis takes this tool from its main branch, and its Gemfile.lock
# records the revision, so a merge here does not reach the chassis — or the
# site — until something tells it. This tells it. The chassis then takes the
# tools as they are, runs its own suite against them, and pushes the lock
# only if that passes, so a merge that breaks the chassis leaves it on the
# last good revision with a red run to look at rather than a broken deploy.
on:
  push:
    branches: [ main ]

concurrency:
  group: chassis
  cancel-in-progress: true

jobs:
  tell-the-chassis:
    runs-on: ubuntu-latest

    steps:
      # A repository_dispatch reaches another repository, which GITHUB_TOKEN
      # cannot do: this needs a token with Contents: write on the chassis,
      # held here as CHASSIS_DISPATCH_TOKEN. Without it the chassis simply
      # never hears, so the job says so rather than passing quietly.
      - name: Ask the chassis to take the tools as they are
        env:
          TOKEN: ${{ secrets.CHASSIS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CHASSIS_DISPATCH_TOKEN is not set here, so the chassis will not hear about this merge."
            echo "Add a token with Contents: write on bobbymeyer/design-chassis as that secret."
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/bobbymeyer/design-chassis/dispatches \
            -d "{\"event_type\":\"tool-updated\",\"client_payload\":{\"tool\":\"${GITHUB_REPOSITORY##*/}\",\"sha\":\"${GITHUB_SHA}\"}}"
