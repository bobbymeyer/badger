name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The sidecar's packages
        run: pip install -r requirements.txt
      - name: The sidecar can run
        # A block, because the ternary's `: ` reads as a mapping to YAML and
        # the whole workflow refused to start on every push before this.
        run: |
          ruby -Ilib -e 'require "badger"; r = Badger.doctor; puts r; exit(r["ok"] ? 0 : 1)'
      - run: bundle exec rake test

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../requirements.txt
      - run: bundle exec rubocop
      - run: bin/rails test
